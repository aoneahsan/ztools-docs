name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build
        env:
          # GA4 Measurement ID. Set as a GitHub Actions repo secret named
          # GA_MEASUREMENT_ID (Settings → Secrets and variables → Actions
          # → New repository secret). Build skips analytics injection when
          # unset (e.g. forks without the secret).
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
        # Note: yarn generate:tools is NOT run in CI because it depends on the
        # sibling ztools repo (private). Generated MDX is committed to this repo.

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
