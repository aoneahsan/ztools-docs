# ──────────────────────────────────────────────────────────────────────────
# Deploy the ZTools docs site to GitHub Pages on every push to main.
#
# Uses the official Pages flow (upload-pages-artifact + deploy-pages) — no
# gh-pages branch to maintain. The custom domain is pinned by static/CNAME,
# which Docusaurus copies verbatim into build/ (so build/CNAME ships in the
# artifact automatically). GitHub Pages must have the custom domain set in
# repo Settings → Pages (owner-only; see docs/MANUAL-TASKS.md).
#
# Tool pages under docs/tools/ are committed to this repo (generated from the
# sibling ../ztools app, which is NOT available in CI), so CI only builds the
# committed content — it does NOT run `yarn generate:tools`.
#
# Optional analytics/monitoring keys are injected from repo secrets; when a
# secret is unset the corresponding SDK/script is skipped entirely.
# ──────────────────────────────────────────────────────────────────────────

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token + the id-token needed by deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so last-update times are accurate

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack (Yarn Berry)
        run: |
          corepack enable
          corepack prepare yarn@stable --activate
          yarn --version

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build
        env:
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          CLARITY_PROJECT_ID: ${{ secrets.CLARITY_PROJECT_ID }}
          AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
